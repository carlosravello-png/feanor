name: publish

# Sube el paquete a PyPI cuando se publica un Release en GitHub. Construye
# desde la etiqueta del Release, así lo que se instala con pip es el mismo
# código que archivan Zenodo y Software Heritage. Sin token: PyPI confía en
# este workflow por "trusted publishing" (proyecto feanor-el-aplasta-libros,
# repositorio carlosravello-png/feanor, workflow publish.yml, entorno pypi).

on:
  release:
    types: [published]

jobs:
  construir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # La versión del paquete tiene que ser la de la etiqueta (v0.6.3 -> 0.6.3).
      - name: Versión igual a la etiqueta
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${{ github.event.release.tag_name }}" || { echo "pyproject dice $v y la etiqueta es ${{ github.event.release.tag_name }}"; exit 1; }

      - name: Construir
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  subir:
    needs: construir
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
