[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aplanar-libro"
version = "0.5.4"
description = "Aplana páginas curvas de libros escaneados, pasa OCR en español y genera Markdown."
readme = "README.md"
license = "MIT"
authors = [{ name = "Carlos Eduardo Ravello Joo" }]
requires-python = ">=3.10"
dependencies = [
  "page-dewarp>=0.3.4",
  "pymupdf>=1.24",
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "msgspec>=0.18",
  "psutil>=5.9",
  "python-pptx>=1.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
# JAX hace que page-dewarp optimice con derivadas (L-BFGS-B) en vez de tanteo
# (Powell): unas 8 veces más rápido al aplanar. Sin JAX, page-dewarp usa SciPy.
rapido = ["jax[cpu]"]

[project.scripts]
aplanar-libro = "aplanar_libro.cli:main"

[tool.setuptools]
packages = ["aplanar_libro"]
