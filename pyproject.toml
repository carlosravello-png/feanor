[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feanor-el-aplasta-libros"
version = "0.6.1"
description = "Feanor: pasa PDF, Word y PowerPoint a Markdown; aplana páginas curvas de libros escaneados y pasa OCR en español."
readme = "README.md"
license = "MIT"
authors = [{ name = "Carlos Eduardo Ravello Joo" }]
requires-python = ">=3.10"
dependencies = [
  "page-dewarp>=0.3.4",
  "pymupdf>=1.24",
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "msgspec>=0.18",
  "psutil>=5.9",
  "python-pptx>=1.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
# JAX hace que page-dewarp optimice con derivadas (L-BFGS-B) en vez de tanteo
# (Powell): unas 8 veces más rápido al aplanar. Sin JAX, page-dewarp usa SciPy.
rapido = ["jax[cpu]"]

[project.scripts]
feanor = "feanor_el_aplasta_libros.cli:main"

[tool.setuptools]
packages = ["feanor_el_aplasta_libros"]
