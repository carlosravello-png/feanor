[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feanor-el-aplasta-libros"
version = "0.6.3"
description = "Feanor: Spanish PDF, Word and PowerPoint to Markdown, with per-page traceability; flattens curved book pages before OCR."
readme = "README.md"
license = "MIT"
authors = [{ name = "Carlos Eduardo Ravello Joo" }]
requires-python = ">=3.10"
keywords = ["OCR", "PDF", "Markdown", "Spanish", "page dewarping", "theses", "text extraction", "research corpus"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Natural Language :: Spanish",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "page-dewarp>=0.3.4",
  "pymupdf>=1.24",
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "msgspec>=0.18",
  "psutil>=5.9",
  "python-pptx>=1.0",
  "python-docx>=1.1",
]

[project.urls]
Homepage = "https://github.com/carlosravello-png/feanor"
Documentation = "https://github.com/carlosravello-png/feanor#readme"
Validation = "https://github.com/carlosravello-png/feanor/blob/main/docs/VALIDATION.md"
Changelog = "https://github.com/carlosravello-png/feanor/blob/main/CHANGELOG.md"
Issues = "https://github.com/carlosravello-png/feanor/issues"
DOI = "https://doi.org/10.5281/zenodo.24522078"

[project.optional-dependencies]
# JAX hace que page-dewarp optimice con derivadas (L-BFGS-B) en vez de tanteo
# (Powell): unas 8 veces más rápido al aplanar. Sin JAX, page-dewarp usa SciPy.
rapido = ["jax[cpu]"]

[project.scripts]
feanor = "feanor_el_aplasta_libros.cli:main"
feanor-el-aplasta-libros = "feanor_el_aplasta_libros.cli:main"

[tool.setuptools]
packages = ["feanor_el_aplasta_libros"]
